[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "justrayzist"
version = "1.8.8"
description = "Offline local image generation app targeting Z-Image Turbo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.2.0",
  "diffusers>=0.39.0",
  "fastapi>=0.116.0",
  "gguf>=0.17.1",
  "huggingface-hub>=0.35.0",
  "einops>=0.8.1",
  "omegaconf>=2.3.0",
  "opencv-python>=4.11.0.86",
  "peft>=0.17.0",
  "pillow>=11.0.0",
  "protobuf>=4.25.0",
  "python-multipart>=0.0.20",
  "psutil>=6.0.0",
  "pyyaml>=6.0.3",
  "rotary-embedding-torch>=0.8.6",
  "safetensors>=0.6.2",
  # Runtime optimization deps (torch.compile / fp8 quant / SageAttention). Each is
  # capability-gated at apply time so older GPUs skip the option rather than crash.
  "sageattention>=1.0.6",
  "torch>=2.9.1",
  "torchao>=0.14.1",
  "torchaudio>=2.9.1",
  "tqdm>=4.67.1",
  "torchvision>=0.24.1",
  "transformers>=4.57.0",
  # Triton kernels power the sageattention/fp8 fast paths. Linux/Mac ship official ``triton``;
  # Windows uses the ``triton-windows`` fork with matching semantics.
  "triton>=3.5.0 ; platform_system != 'Windows'",
  "triton-windows>=3.5.1 ; platform_system == 'Windows'",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
justrayzist = "app.cli.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
