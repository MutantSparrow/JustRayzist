name: Rayzist_bf16
enabled: true
architecture: z_image_turbo
backend_preference:
  - diffusers
pipeline_config_dir: ./config
components:
  transformer:
    path: ./weights/Rayzist.v1.0.safetensors
    format: safetensors
  vae:
    path: ./weights/diffusion_pytorch_model.safetensors
    format: safetensors
  text_encoder:
    path: ./config/text_encoder/model.safetensors
    format: safetensors
required_configs:
  - ./config/model_index.json
  - ./config/scheduler/scheduler_config.json
  - ./config/tokenizer/tokenizer.json
  - ./config/transformer/config.json
  - ./config/vae/config.json
  - ./config/text_encoder/config.json

# Post-load runtime optimizations — each capability-gated.
# torch.compile is OFF: even without the fp8-storage hook that Krea2 hits, the first-gen compile
# warmup was net-negative on the 9:16 portrait bench (24.3 s → 31.7 s). Enable it once the
# inductor cache warms across sessions and warmup no longer shows in every run.
# fp8_quantization is OFF: Z-Image ships bf16 weights natively so quantization adds load-time
# cost with no matmul benefit.
# SageAttention, TF32, and VAE tiling are always safe wins on capable hardware.
optimizations:
  torch_compile:
    enabled: false
    mode: default
  fp8_quantization:
    enabled: false
    scope: transformer
  sage_attention:
    enabled: true
  tf32:
    enabled: true
  vae_tiling:
    enabled: true