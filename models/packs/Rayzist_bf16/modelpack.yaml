name: Rayzist_bf16
enabled: true
architecture: z_image_turbo
backend_preference:
  - diffusers
pipeline_config_dir: ./config
components:
  transformer:
    path: ./weights/Rayzist.v1.0.safetensors
    format: safetensors
  vae:
    path: ./weights/diffusion_pytorch_model.safetensors
    format: safetensors
  text_encoder:
    path: ./config/text_encoder/model.safetensors
    format: safetensors
required_configs:
  - ./config/model_index.json
  - ./config/scheduler/scheduler_config.json
  - ./config/tokenizer/tokenizer.json
  - ./config/transformer/config.json
  - ./config/vae/config.json
  - ./config/text_encoder/config.json

# Post-load runtime optimizations — each capability-gated.
# torch.compile is OFF for Z-Image: the pipeline builder's ``_cast`` seam (see
# app/core/pipeline_factory/zimage.py:63) switches dtypes per parameter, which triggers dynamo
# recompiles (8+ on the first gen) and net-regresses first-run wall time (2026-07-16 RTX 4090
# bench: 24.3 s → 31.7 s on 9:16 portrait). Krea2's flow-matching path doesn't hit this so it
# keeps compile ON.
# fp8_quantization is OFF because Z-Image ships bf16 weights natively — a bf16→fp8 conversion
# would add load-time cost with no matmul benefit.
# SageAttention runs on every GPU from Turing (sm_75) onward and gave a ~1.2× on the anime prompt.
optimizations:
  torch_compile:
    enabled: false
    mode: default
  fp8_quantization:
    enabled: false
    scope: transformer
  sage_attention:
    enabled: true